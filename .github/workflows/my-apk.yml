name: Build My APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Setup Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/xplatform-release.jks
          cat << 'EOF' > android/key.properties
          storePassword=XPlatform2026!
          keyPassword=XPlatform2026!
          keyAlias=xplatform
          storeFile=xplatform-release.jks
          EOF

      - name: Sync Custom Icons & Branding
        run: |
          sed -i 's/app\.hiddify\.com/online.skydpi.xplatform/g' android/app/build.gradle* android/app/src/main/AndroidManifest.xml || true
          sed -i 's/hiddify\/hiddify-next/X-PlatformVPN\/XPlatform-app/g' lib/core/model/constants.dart || true
          sed -i 's/hiddify\/hiddify-app/X-PlatformVPN\/XPlatform-app/g' lib/core/model/constants.dart || true
          sed -i 's/"Hiddify"/"X-Platform VPN"/g' lib/core/model/constants.dart lib/features/app/widget/app.dart || true
          sed -i "s/'Hiddify'/'X-Platform VPN'/g" lib/core/model/constants.dart lib/features/app/widget/app.dart || true
          find assets/translations -type f -exec sed -i 's/"Hiddify"/"X-Platform VPN"/g' {} + || true
          sed -i 's/>Hiddify</>X-Platform VPN</g' android/app/src/main/res/values*/strings.xml || true
          sed -i 's/Assets\.images\.logo\.svg(/Image.asset("assets\/images\/tray_icon.png", /g' lib/features/about/widget/about_page.dart || true
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          NS_ANDROID=$(printf '%s:%s%s.%s/%s/%s/%s' 'http' '//' 'schemas' 'android.com' 'apk' 'res' 'android')
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="%s">\n    <background android:drawable="@android:color/white"/>\n    <foreground android:drawable="@mipmap/ic_launcher"/>\n</adaptive-icon>\n' "$NS_ANDROID" > android/app/src/main/res/mipmap-anydpi-v26/ic_banner.xml
          printf '<vector xmlns:android="%s" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M5.5,4L12,10.5L18.5,4L20,5.5L13.5,12L20,18.5L18.5,20L12,13.5L5.5,20L4,18.5L10.5,12L4,5.5Z"/></vector>\n' "$NS_ANDROID" > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          find android/app/src/main/res/mipmap-* -name "ic_launcher*.webp" -delete
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            cp assets/images/source/ic_launcher_foreground.png "$dir/ic_launcher.png"
            cp assets/images/source/ic_launcher_foreground.png "$dir/ic_launcher_round.png"
          done
          WELCOME_IMG="assets/images/source/welcome_logo.png"
          [ ! -f "$WELCOME_IMG" ] && WELCOME_IMG="assets/images/source/logo_transparent.png"
          cp "$WELCOME_IMG" assets/images/tray_icon.png
          cp "$WELCOME_IMG" assets/images/source/ic_launcher_border.png
          cp "$WELCOME_IMG" assets/images/source/ic_launcher_splash.png
          find android/app/src/main/res -name "*splash*.png" -exec cp "$WELCOME_IMG" {} \;
          sed -i 's/#FBF8FF/#0E0D15/g' pubspec.yaml
          sed -i 's/#121318/#0E0D15/g' pubspec.yaml
          sed -i 's/^version:.*/version: 1.0.0+1/' pubspec.yaml
          NS_SVG=$(printf '%s:%s%s.%s/%s/%s' 'http' '//' 'www' 'w3.org' '2000' 'svg')
          printf '<svg xmlns="%s" viewBox="0 0 24 24"><path fill="#7B61FF" d="M5.5 4L12 10.5 18.5 4 20 5.5 13.5 12 20 18.5 18.5 20 12 13.5 5.5 20 4 18.5 10.5 12 4 5.5z"/></svg>\n' "$NS_SVG" > assets/images/logo.svg

      - name: Prepare Hiddify Core & Codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run flutter_native_splash:create
          make android-libs

      - name: Build Release APK
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk X-Platform-VPN.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: X-Platform-VPN
          path: X-Platform-VPN.apk
