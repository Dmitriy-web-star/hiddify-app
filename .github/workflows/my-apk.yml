
name: Build My APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Setup Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/xplatform-release.jks
          cat << 'EOF' > android/key.properties
          storePassword=XPlatform2026!
          keyPassword=XPlatform2026!
          keyAlias=xplatform
          storeFile=xplatform-release.jks
          EOF

      - name: Prepare Hiddify Core & Codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          make android-libs

      - name: Sync Custom Icons & Branding
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          NS_ANDROID="http://schemas.""://android.com"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="%s">\n    <background android:drawable="@android:color/white"/>\n    <foreground android:drawable="@mipmap/ic_launcher"/>\n</adaptive-icon>\n' "$NS_ANDROID" > android/app/src/main/res/mipmap-anydpi-v26/ic_banner.xml
          find android/app/src/main/res/mipmap-* -name "ic_launcher*.webp" -delete
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            cp assets/images/source/ic_launcher_foreground.png "$dir/ic_launcher.png"
            cp assets/images/source/ic_launcher_foreground.png "$dir/ic_launcher_round.png"
          done
          cp assets/images/source/logo_transparent.png assets/images/tray_icon.png
          cp assets/images/source/logo_transparent.png assets/images/source/ic_launcher_splash.png
          find android/app/src/main/res -name "*splash*.png" -exec cp assets/images/source/logo_transparent.png {} \;
          sed -i 's/#FBF8FF/#0E0D15/g' pubspec.yaml
          sed -i 's/#121318/#0E0D15/g' pubspec.yaml
          dart run flutter_native_splash:create
          B64=$(base64 -w 0 assets/images/source/logo_transparent.png)
          NS_SVG="http://www.""w3.org/2000/svg"
          printf '<svg xmlns="%s" viewBox="0 0 120 120"><image href="data:image/png;base64,%s" x="4" y="4" width="112" height="112"/></svg>\n' "$NS_SVG" "$B64" > assets/images/logo.svg

      - name: Build Release APK
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk X-Platform-VPN.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: X-Platform-VPN
          path: X-Platform-VPN.apk
